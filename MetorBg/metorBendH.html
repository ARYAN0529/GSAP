<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meteor line background</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    min-height: 100vh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .hero {
    position: relative;
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
  }

  #lines-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* meteor rides the exact same curve as its matching svg line,
     via offset-path, so it can only ever move along that line */
  .meteor {
    position: absolute;
    top: 0;
    left: 0;
    width: 70px;
    height: 4px;
    border-radius: 5px;
    filter: blur(2px);
    opacity: 0;
    offset-rotate: auto;
    animation-name: travel;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    /* red trailing tail -> blue leading head */
    background: linear-gradient(90deg, rgba(255,90,90,0) 0%, rgba(255,90,90,0.35) 45%, rgba(90,150,255,0.85) 100%);
  }

  @keyframes travel {
    0%   { offset-distance: 0%;   opacity: 0; }
    10%  { opacity: 0.7; }
    55%  { offset-distance: 100%; opacity: 0; }
    100% { offset-distance: 100%; opacity: 0; }
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 2rem;
  }

  .content h1 {
    color: #fff;
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 600;
    margin-bottom: 12px;
  }

  .content p {
    color: #9aa0b8;
    font-size: 16px;
    max-width: 480px;
  }
</style>
</head>
<body>

<div class="hero" id="hero">
  <svg id="lines-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="content">
    <h1>Your analytics need at one place</h1>
    <p>Imagine maps with 100+ features and rock-solid security. That's SecretEye.</p>
  </div>
</div>

<script>
  const hero = document.getElementById('hero');
  const svg = document.getElementById('lines-svg');

  const W = window.innerWidth;
  const H = window.innerHeight;

  const SPACING = 26;          // horizontal gap between lines, px (dense grid)
  const DROP = 90;             // net rightward drift top -> bottom, px
  const BEND = 70;             // how strongly each line bends into an S
  const CYCLE = 10;            // seconds per travel+pause loop
  const METEOR_CHANCE = 0.3;   // fraction of lines that get a meteor

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const colCount = Math.ceil((W + 400) / SPACING);

  // builds one gentle S-curve path running top to bottom: starts
  // slightly left, bends right, bends left, ends slightly further
  // right net overall (vertical line, top to a little lower-right)
  function buildPath(offsetX) {
    const y0 = -60, y3 = H + 60;
    const x0 = offsetX;
    const x3 = offsetX + DROP;
    const y1 = H * 0.32, y2 = H * 0.68;
    const x1 = offsetX - BEND;
    const x2 = offsetX + DROP + BEND;
    return `M ${x0},${y0} C ${x1},${y1} ${x2},${y2} ${x3},${y3}`;
  }

  for (let i = 0; i < colCount; i++) {
    const offsetX = i * SPACING - 200;
    const d = buildPath(offsetX);

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'rgba(140,150,255,0.16)');
    path.setAttribute('stroke-width', '1');
    svg.appendChild(path);

    if (Math.random() < METEOR_CHANCE) {
      const meteor = document.createElement('div');
      meteor.className = 'meteor';
      meteor.style.offsetPath = `path('${d}')`;
      meteor.style.animationDuration = (CYCLE + Math.random() * 4) + 's';
      meteor.style.animationDelay = (-Math.random() * 20) + 's';
      hero.appendChild(meteor);
    }
  }
</script>

</body>
</html>
