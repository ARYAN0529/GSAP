<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aryan Sharma — Developer</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: 'Inter', sans-serif;
            overflow-x:hidden;
        }

        #bg-video{
            position:fixed;
            inset:0;
            width:100%;
            height:100%;
            object-fit:cover;
            z-index:-2;
        }

        /* Optional dark overlay for readability */
        .overlay{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.25);
            z-index:-1;
        }
    </style>

</head>

<body>

    <!-- Background Video -->
    <video autoplay muted loop playsinline id="bg-video">
        <source src="/Portfolio/assets/original-d5c7eb3381e214ea62b74126b5ce529c.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <!-- Navbar -->
    <nav
        class="
        fixed
        top-[10px]
        left-1/2
        -translate-x-1/2

        w-[calc(100%-20px)]
        max-w-6xl

        z-50

        px-7
        py-3

        flex
        justify-between
        items-center

        rounded-full

        bg-white/10

        backdrop-blur-[22px]
        backdrop-saturate-200

        border
        border-white/20

        ring-1
        ring-white/10

        shadow-[0_12px_40px_rgba(0,0,0,0.35)]
    ">

        <!-- Logo -->
        <h2 class="text-white font-semibold text-xl tracking-wide">
            Aryan
        </h2>

        <!-- Navigation -->
        <div class="flex items-center gap-8">

            <a href="#" class="text-white/90 hover:text-white transition">
                Home
            </a>

            <a href="#" class="text-white/90 hover:text-white transition">
                About
            </a>

            <a href="#" class="text-white/90 hover:text-white transition">
                Work
            </a>

            <a href="#" class="text-white/90 hover:text-white transition">
                Resume
            </a>

            <button
                class="
                px-5
                py-2

                rounded-full

                bg-white

                text-black

                font-medium

                hover:scale-105

                transition
                duration-300
                ">
                Contact Me
            </button>

        </div>

    </nav>

    <!-- Hero -->
    <section class="h-screen flex items-center justify-center">

        <div class="text-center">

           

          

        </div>

    </section>

</body>
</html>
